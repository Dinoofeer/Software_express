<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo de Videojuegos - Software Express</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Sistema de Torneo de Videojuegos</h1>
    <div id="mensaje" class="alert"></div>

  //1
    

    <div class="grid">
        <form id="form-jugador">
            <h3>Registrar Jugador</h3>
            <input type="text" id="j-nombre" placeholder="Nombre completo" required>
            <input type="text" id="j-gamertag" placeholder="Gamertag / Alias" required>
            <input type="email" id="j-correo" placeholder="Correo electrónico" required>
            <button type="submit">Guardar Jugador</button>
        </form>

        <form id="form-videojuego">
            <h3>Registrar Videojuego</h3>
            <input type="text" id="v-nombre" placeholder="Nombre del juego" required>
            <input type="text" id="v-genero" placeholder="Género" required>
            <button type="submit">Guardar Videojuego</button>
        </form>
    </div>

   //

    <script src="app.js"></script>
</body>
</html>
